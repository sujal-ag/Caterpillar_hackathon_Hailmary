# Rule table v1 — HLD §4.4, with plan.md §3 decisions applied.
# Every threshold lives here or in data/seed/machine_models.yaml ("thresholds: machine_model").
# `assumption: true` marks values the team must review.
#
# Keys per rule (plan.md Phase 0 item 4), plus two additive keys:
#   once_per:     cooldown scope for HLD "per exit / per event / per code ..." cooldowns
#                 (EXIT | EVENT | EPISODE | CODE | ZONE_ENTRY | SHIFT | null)
#   escalate_to:  what an escalation changes (level, channels, audio_clip); used with escalate_after_s
# `display` for rules the HLD does not specify (anything except R02/R03/R05/R09) is a backend
# proposal for P3 to confirm; the rule is tagged `display_proposed: true`.
#
# Plan-wins note on HLD "State" column (D20): state_effect UNSAFE | ATTENTION | NONE.

version: 1
hld_ref: "§4.4"

# Derived predicates (HLD §4.4 "Derived predicates used by rules").
predicates:
  active:
    travel_kmh_gt: 0.3
    swing_deg_s_abs_gt: 1
    hyd_pump_press_kpa_gt: 4000
    joystick_window_s: 5
    hld_ref: "§4.4 active"
  idle:
    min_s: 30
    hld_ref: "§4.4 idle"
  grounded:
    bucket_height_m_le: 0.3
    hld_ref: "§4.4 grounded; D12"
  exit_intent:
    seat_vacated_gt_s: 2
    hld_ref: "§4.4 exit_intent (strong)"
  exit_hint:
    belt_off_within_s: 10
    hld_ref: "§4.4 exit_hint (weak)"
  wet:
    rh_pct_ge: 90
    dew_point_spread_c_le: 2
    hld_ref: "§4.4 wet"
  moving:
    travel_kmh_gt: 0.3
    hld_ref: "D1 MOVING check; same travel threshold as `active`"

# Exit Guard check set (D1).
exit_checks:
  all_models: [ENGINE_RUNNING, HYD_UNLOCKED, IMPLEMENT_RAISED, MOVING, SLOPE]
  wheel_loader_extra: [PARK_BRAKE_OFF]
  slope_thresholds: machine_model      # pitch/roll > model caution
  # Order the Exit Guard checklist is rendered in (nudge.v1 `checklist`): the order the
  # operator fixes things in the HLD message "lower the bucket, lock hydraulics, stop the
  # engine" (§3.2, §4.4 R03), then the rest. Filtered to the machine's own check set.
  checklist_order: [IMPLEMENT_RAISED, HYD_UNLOCKED, ENGINE_RUNNING, MOVING, PARK_BRAKE_OFF, SLOPE]
  hld_ref: "D1"

# Engine-wide timing and alert-fatigue policy.
policy:
  audio_budget_s: 30                   # max one non-CRITICAL audio per 30 s per machine (§4.4)
  target_noncritical_alerts_per_h: 4   # §4.4 alert-fatigue KPI
  class_hysteresis_s: 10               # §4.3
  data_stale_s: 3                      # §4.2
  switch_flap_suppress_ms: 500         # D2 leading-edge debounce
  proximity_fresh_s: 1                 # plan Phase 3 item 1
  position_stale_s: 10                 # §4.12
  tone_patterns:
    INFO: tone_info
    CAUTION: tone_caution
    WARNING: tone_warning
    CRITICAL: tone_critical
  hld_ref: "§4.2, §4.3, §4.4, §4.12"

