# Audio clip catalogue. P3 pre-renders every `voice` clip with Piper (en_US-lessac-medium) at build time.
# Slots in `text` (e.g. {max_boom_m}) are spoken at runtime from number clips or Piper (HLD §4.10).
# source: hld = text copied from HLD §4.4 rule table; proposed = backend wording, P3/team to review.
# Agreed by: P3 ☐

voice:
  seatbelt_off_while_operating:
    message_key: nudge.seatbelt.off_while_operating
    text: "Seatbelt off while operating — stop and fasten your belt."
    source: hld
  exit_guard_before_exiting:
    message_key: nudge.exit_guard.before_exiting
    text: "Before exiting: lower the bucket, lock hydraulics, stop the engine."
    source: hld
  exit_secured_engine_on:
    message_key: nudge.exit.secured_engine_on
    text: "Machine secured. Engine still running — shut down if you'll be away more than 5 minutes."
    source: hld
  exit_three_point_contact:
    message_key: nudge.exit.three_point_contact
    text: "Steps may be slippery — use three points of contact."
    source: hld
  seatbelt_bypass:
    message_key: nudge.seatbelt.bypass
    text: "Seatbelt latched with no one in the seat."
    source: hld
  idle_leaving_shutdown:
    message_key: nudge.idle.leaving_shutdown
    text: "If you're leaving, shut down the engine and secure the attachment."
    source: hld
  tilt_slope:
    message_key: nudge.tilt.slope
    text: "Machine on a slope — check stability."
    source: hld
  tilt_tip_over:
    message_key: nudge.tilt.tip_over
    text: "Tip-over risk. Stop, lower the implement."
    source: hld
  proximity_person_behind:
    message_key: nudge.proximity.person_behind
    text: "Person behind machine — stop swinging."
    source: hld
  geofence_enter_WORKER_ZONE:
    message_key: nudge.geofence.enter.WORKER_ZONE
    text: "Workers ahead — slow down and watch for people."
    source: proposed
  geofence_enter_OVERHEAD_LINE:
    message_key: nudge.geofence.enter.OVERHEAD_LINE
    text: "Overhead power line ahead — keep boom below {max_boom_m} m."
    source: hld
  geofence_enter_SOFT_GROUND:
    message_key: nudge.geofence.enter.SOFT_GROUND
    text: "Soft ground ahead — check it before driving on."
    source: proposed
  geofence_enter_BURIED_UTILITY:
    message_key: nudge.geofence.enter.BURIED_UTILITY
    text: "Buried utility here — do not dig without clearance."
    source: proposed
  geofence_enter_TRENCH:
    message_key: nudge.geofence.enter.TRENCH
    text: "Open trench ahead — keep back from the edge."
    source: proposed
  geofence_enter_DROP_OFF:
    message_key: nudge.geofence.enter.DROP_OFF
    text: "Drop-off ahead — keep back from the edge."
    source: proposed
  geofence_enter_OTHER:
    message_key: nudge.geofence.enter.OTHER
    text: "Reported hazard ahead — proceed with care."
    source: proposed
  powerline_too_close:
    message_key: nudge.powerline.too_close
    text: "Boom too close to power line."
    source: hld
  dtc_stop:
    message_key: nudge.dtc.stop
    text: "Stop and follow shutdown procedure."
    source: hld
  dtc_monitor:
    message_key: nudge.dtc.monitor
    text: "Machine alert {code} — see what to do."
    source: proposed
  temp_rising:
    message_key: nudge.temp.rising
    text: "Temperatures rising — reduce load, check cooler for debris."
    source: hld
  fatigue_take_break:
    message_key: nudge.fatigue.take_break
    text: "Signs of fatigue — take a 10-minute break at a safe spot."
    source: hld
  readiness_red:
    message_key: nudge.readiness.red
    text: "Readiness is red — take a break, then retest."
    source: proposed
  heat_hydrate:
    message_key: nudge.heat.hydrate
    text: "High heat — drink water and rest in the shade."
    source: proposed
  coupler_not_verified:
    message_key: nudge.coupler.not_verified
    text: "Attachment lock not verified — do the ground-press test."
    source: hld

# Non-speech tones. tone_pattern in nudge.v1 is one of the tone_* ids (one per level, HLD §9 design rules).
tones:
  tone_info: {description: "single soft beep"}
  tone_caution: {description: "two medium beeps"}
  tone_warning: {description: "three fast beeps"}
  tone_critical: {description: "continuous distinct pattern; never suppressed (I4)"}
  chime_soft: {description: "R02 escalation soft chime"}
