[project]
name = "ml_runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.5.2",
    "lightgbm==4.5.0",
    "joblib==1.4.2",
    "numpy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ml_runtime*"]
