# --- Demo machine-specific code (user request, 2026-09-24). NOT a real CAT code: SPN 520192
# is the start of the J1939 manufacturer-proprietary range, used here as a placeholder.
# CAT 320 excavator only. action_class STOP is a demo assumption (assumption: true), not
# from any CAT document. Raised by the `demo_e001` replay scenario.
- code_id: DEMO-E001
  spn: 520192
  fmi: 31
  cat_code: E001
  component: Hydraulic lockout lever switch (CAT 320 excavator)
  description: Hydraulic lockout lever switch signal lost (demo code)
  severity: 1
  action_class: STOP
  what_happened: The machine can no longer tell whether the hydraulic lockout lever is locked.
  why_it_matters: Exit Guard cannot confirm the hydraulics are locked, so the implement could move when you leave the seat.
  what_to_do: Lower the bucket to the ground, stop the engine before leaving the cab, and report the switch fault to maintenance.
  source_doc: "DEMO corpus — not a real CAT code"
  source_section: null
  doc_version: null
