# Demo tasks, attached by seed.py to the machine's shift for the seed date (the current
# shift). Times are minutes after that shift's planned start (SHIFT_START), so the file
# never goes stale and follows SHIFT_START/SHIFT_END. With the default 07:00 start:
# task 1 07:15–10:30, task 2 13:15–15:30.
- task_id_suffix: "1"
  shift_id: null            # filled in by seed.py: the machine's shift for the seed date
  machine_id: EXC001
  operator_id: OP1001
  task_type_id: TRUCK_LOAD
  zone_id: Z-NORTH-CUT
  planned_quantity: 420
  unit: M3
  soil_type: CLAY_WET
  material_density_t_m3: 1.7
  haul_distance_m: 60
  trucks_assigned: 3
  truck_capacity_t: 16
  priority: 2
  start_after_shift_min: 15
  end_after_shift_min: 210
  status: SCHEDULED
- task_id_suffix: "2"
